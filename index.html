<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFC549" />
    <meta name="description" content="Economic Students’ Chamber (DPE) Brunei — a student-led community for economics and policy." />
    <title>Economic Students’ Chamber (ESC) Brunei</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <style>
      /* Brand fonts. Put the font files in public/fonts/ (see README).
         local() uses the font if it is installed on the visitor's device. */
      @font-face {
        font-family: 'Plate Gothic Three Four';
        src: local('Plate Gothic Three Four'), local('PlateGothicThreeFour'),
             url('fonts/PlateGothicThreeFour.woff2') format('woff2'),
             url('fonts/PlateGothicThreeFour.woff') format('woff'),
             url('fonts/PlateGothicThreeFour.otf') format('opentype');
        font-display: swap;
      }
      @font-face {
        font-family: 'Glacial Indifference';
        src: local('Glacial Indifference'), local('GlacialIndifference-Regular'),
             url('fonts/GlacialIndifference-Regular.woff2') format('woff2'),
             url('fonts/GlacialIndifference-Regular.otf') format('opentype');
        font-weight: 400; font-display: swap;
      }
      @font-face {
        font-family: 'Glacial Indifference';
        src: local('Glacial Indifference Bold'), local('GlacialIndifference-Bold'),
             url('fonts/GlacialIndifference-Bold.woff2') format('woff2'),
             url('fonts/GlacialIndifference-Bold.otf') format('opentype');
        font-weight: 700; font-display: swap;
      }
      @font-face {
        font-family: 'Glacial Indifference';
        src: local('Glacial Indifference Italic'), local('GlacialIndifference-Italic'),
             url('fonts/GlacialIndifference-Italic.woff2') format('woff2'),
             url('fonts/GlacialIndifference-Italic.otf') format('opentype');
        font-weight: 400; font-style: italic; font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
